<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - JobMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="auth-header">
    <a href="index.html" class="logo">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBFAF7" stroke-width="2"><path d="M3 21h18M6 21V9l6-5 6 5v12M10 21v-6h4v6"/></svg>
      </span>
      JobMate
    </a>
    <nav class="auth-nav">
      <a href="index.html#trades">Trades</a>
      <a href="index.html#jobs">Jobs</a>
      <a href="index.html#how">About</a>
      <a href="login.html" class="btn-login">Log In</a>
      <a href="signup.html" class="btn-signup">Sign Up</a>
    </nav>
  </header>

  <!-- Centered Form Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-body">
        
        <!-- Logo & Title Section -->
        <div class="auth-brand">
          <span class="mark" style="width:30px; height:30px; background:var(--ink); border-radius:4px; display:inline-flex; align-items:center; justify-content:center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FBFAF7" stroke-width="2" width="18" height="18"><path d="M3 21h18M6 21V9l6-5 6 5v12M10 21v-6h4v6"/></svg>
          </span>
          <span style="font-family:'Bebas Neue'; font-size:26px; color:var(--ink); letter-spacing:0.03em;">JobMate</span>
        </div>
        
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Join JobMate to connect with workers or find jobs</p>

        <!-- Dynamic Role Selector (Toggle Style matching the reference design) -->
        <div class="role-toggle">
          <button type="button" id="btnRoleWorker" class="active" onclick="selectRole('worker')">Worker / Pro</button>
          <button type="button" id="btnRoleClient" onclick="selectRole('client')">Client / Employer</button>
        </div>

        <form id="signupForm" novalidate>
          <input type="hidden" id="sRole" value="worker">

          <div class="form-grid">
            <div class="f full">
              <label for="sName">Full Name</label>
              <input id="sName" placeholder="e.g. Kavindu Rathnayake" required>
            </div>

            <div class="f full">
              <label for="sEmail">Email Address</label>
              <input id="sEmail" type="email" placeholder="you@example.com" required>
            </div>

            <div class="f full">
              <label for="sPass">Password</label>
              <input id="sPass" type="password" placeholder="At least 6 characters" required>
            </div>

            <!-- Conditional Fields for Workers -->
            <div class="f worker-field"><label for="sTrade">Trade</label><select id="sTrade"><option>Mason</option><option>Electrician</option><option>Plumber</option><option>Carpenter</option><option>Painter</option><option>Welder</option><option>Roofer
</option><option>Landscaper</option></select></div>
            <div class="f worker-field"><label for="sLoc">Location</label><input id="sLoc" placeholder="Town or City"></div>
            <div class="f worker-field"><label for="sExp">Years of Experience</label><input id="sExp" type="number" min="0" value="1"></div>
            <div class="f worker-field"><label for="sPhone">Phone Number</label><input id="sPhone" type="tel" placeholder="077xxxxxxx"></div>
            <div class="f full worker-field"><label for="sSkills">Skills (comma separated)</label><input id="sSkills" placeholder="e.g. Wiring, Tiling, Brickwork"></div>
            <div class="f full worker-field"><label for="sBio">Short Bio / Overview</label><textarea id="sBio" placeholder="Describe your experience..."></textarea></div>
          </div>

          <div class="err" id="signupErr" style="margin-top:10px;"></div>

          <button class="btn-submit" type="submit">Agree &amp; Join JobMate</button>

          <p style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--charcoal-soft);">
            Already have an account? <a href="login.html" style="color:var(--steel); font-weight:700;">Sign in</a>
          </p>
        </form>

      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="signup.js"></script>
  <script>
    // JS helper to handle pill toggle state
    function selectRole(role) {
      document.getElementById('sRole').value = role;
      const workerBtn = document.getElementById('btnRoleWorker');
      const clientBtn = document.getElementById('btnRoleClient');
      
      if (role === 'worker') {
        workerBtn.classList.add('active');
        clientBtn.classList.remove('active');
      } else {
        clientBtn.classList.add('active');
        workerBtn.classList.remove('active');
      }

      document.querySelectorAll('.worker-field').forEach(el => {
        el.style.display = (role === 'worker') ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
