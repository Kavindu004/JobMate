<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All open jobs - JobMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="jobs">
<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBFAF7" stroke-width="2"><path d="M3 21h18M6 21V9l6-5 6 5v12M10 21v-6h4v6"/></svg>
      </span>
      JobMate
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#trades">Trades</a>
      <a href="index.html#browse">Find a pro</a>
      <a href="index.html#jobs">Jobs</a>
      <a href="index.html#how">How it works</a>
      <a href="index.html#reviews">Reviews</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;" id="authNavButtons">
      <a href="login.html" class="btn btn-outline nav-cta">Login</a>
      <a href="signup.html" class="btn btn-primary nav-cta">Sign Up</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="list-page">
  <div class="wrap">
    <h1 class="list-title">All open jobs</h1>
    <form class="list-search" id="listForm" novalidate>
      <div class="search-wrap grow"><i class="fa-solid fa-magnifying-glass"></i>
        <input id="q" type="search" placeholder="Search jobs by keyword (e.g. wiring, wall, pipes)" aria-label="Search by keyword" autocomplete="off"></div>
      <div class="search-wrap"><i class="fa-solid fa-location-dot"></i>
        <input id="loc" type="text" list="locList" placeholder="Filter by location" aria-label="Filter by location" autocomplete="off"></div>
      <datalist id="locList"></datalist>
    </form>
    <div class="count-line" style="margin-bottom:18px;"><strong id="count">0</strong> open jobs found</div>
    <div class="job-grid" id="grid"></div>
  </div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true"><button class="x" id="modalX" aria-label="Close">&times;</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="listing.js"></script>
</body>
</html>
